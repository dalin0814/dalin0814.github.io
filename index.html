<script>
function filterCards() {
  var q = document.getElementById('searchInput').value.toLowerCase();
  var categories = document.querySelectorAll('.category');
  categories.forEach(function(cat) {
    var cards = cat.querySelectorAll('.card');
    var visible = 0;
    cards.forEach(function(card) {
      var text = card.textContent.toLowerCase();
      if (text.includes(q) || q === '') {
        card.style.display = 'block';
        visible++;
      } else {
        card.style.display = 'none';
      }
    });
    cat.style.display = visible > 0 ? 'block' : 'none';
  });
  updateStats();
}
function updateStats() {
  var total = document.querySelectorAll('.category').length;
  var visible = document.querySelectorAll('.category[style="display: block"], .category:not([style])').length;
  document.getElementById('stats').textContent = '鍏?' + visible + ' / ' + total + ' 涓垎绫?;
}
updateStats();
</script>
